spring:
  application:
    name: place-finder-api
  config:
    # Optional, git-ignored overrides for your machine (copy application-local.example.yml).
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=place_finder;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
    properties:
      hibernate:
        # Our text columns are NVARCHAR (Unicode place names)
        type.prefer_nationalized_character_data: true
        # Store Instant in DATETIME2 as UTC
        type.preferred_instant_jdbc_type: TIMESTAMP
        jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
